name: Instagram Auto-Scheduler

on:
  schedule:
    - cron: '0 * * * *' # Runs at the start of every hour, 24/7
  workflow_dispatch: # Allows you to manually trigger it anytime for testing

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed so the script can push changes back to the repo
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests google-api-python-client google-auth-oauthlib google-auth-httplib2 opencv-python-headless

      - name: Run posting script
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python post_script.py
