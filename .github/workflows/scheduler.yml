name: Instagram Auto-Scheduler

on:
  schedule:
    - cron: '0 * * * *' # Runs at the start of every hour, 24/7
  workflow_dispatch: # Allows you to manually trigger it anytime for testing

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed so the script can push changes back to the repo
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run posting script
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python post_script.py
